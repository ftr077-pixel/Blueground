<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoiceBridge — operator</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
         background: #111; color: #eee; }
  header { padding: 16px 20px; border-bottom: 1px solid #2a2a2a;
           display: flex; align-items: center; gap: 16px; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 0;
           background: #2f6f4f; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .45; cursor: default; }
  #state { font-variant-numeric: tabular-nums; color: #9a9a9a; }
  #log { padding: 16px 20px; margin: 0; list-style: none; }
  #log li { padding: 6px 0; align-items: baseline; border-bottom: 1px solid #1e1e1e;
            display: grid; grid-template-columns: 150px 52px 1fr; gap: 12px; }
  .name { color: #7a7a7a; }
  .dir  { color: #5a8fb5; }
  .a2b  { color: #8fd6a8; }
  .b2a  { color: #d6c98f; }
</style>
</head>
<body>
<header>
  <h1>VoiceBridge operator</h1>
  <button id="join">Connect</button>
  <span id="state">idle</span>
</header>
<ul id="log"></ul>

<script>
const RATE = 16000;          // ADR-002: everything is 16 kHz mono PCM16
// createScriptProcessor only accepts powers of two. 1024 frames at 16 kHz
// is 64 ms of capture latency, which fits the §5 budget.
const BUFFER = 1024;

const joinBtn = document.getElementById('join');
const stateEl = document.getElementById('state');
const logEl = document.getElementById('log');

let ws, micCtx, playCtx, playHead = 0, node, stream;
let wanted = false, attempt = 0, retryTimer = null;
const scheduled = new Set();

function setState(text) { stateEl.textContent = text; }

function addLine(event) {
  const li = document.createElement('li');
  const name = document.createElement('span');
  name.className = 'name';
  name.textContent = event.name;
  const dir = document.createElement('span');
  dir.className = 'dir ' + (event.direction || '');
  dir.textContent = event.direction || '';
  const text = document.createElement('span');
  text.className = event.direction || '';
  text.textContent = event.translated_text || event.text || event.detail || '';
  li.append(name, dir, text);
  logEl.prepend(li);
  while (logEl.children.length > 300) logEl.lastChild.remove();
}

// Browsers may ignore the requested sampleRate (Safari in particular), so
// capture is resampled here rather than assumed. ADR-002 says the wire is
// always 16 kHz; this is the one place the browser's rate is allowed to differ.
function resampleTo16k(samples, fromRate) {
  if (fromRate === RATE) return samples;
  const ratio = fromRate / RATE;
  const out = new Float32Array(Math.floor(samples.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const pos = i * ratio;
    const low = Math.floor(pos);
    const high = Math.min(low + 1, samples.length - 1);
    out[i] = samples[low] + (samples[high] - samples[low]) * (pos - low);
  }
  return out;
}

function floatToPcm16(samples) {
  const out = new DataView(new ArrayBuffer(samples.length * 2));
  for (let i = 0; i < samples.length; i++) {
    const clamped = Math.max(-1, Math.min(1, samples[i]));
    out.setInt16(i * 2, clamped * 0x7fff, true);
  }
  return out.buffer;
}

function playPcm16(buffer) {
  const view = new DataView(buffer);
  const frames = buffer.byteLength / 2;
  if (!frames) return;
  const audio = playCtx.createBuffer(1, frames, RATE);
  const channel = audio.getChannelData(0);
  for (let i = 0; i < frames; i++) channel[i] = view.getInt16(i * 2, true) / 0x8000;
  const source = playCtx.createBufferSource();
  source.buffer = audio;
  source.connect(playCtx.destination);
  // Keep a small lead so chunks butt up against each other without gaps.
  playHead = Math.max(playHead, playCtx.currentTime + 0.05);
  source.start(playHead);
  playHead += audio.duration;
  scheduled.add(source);
  source.onended = () => scheduled.delete(source);
}

function flushPlayback() {
  // Barge-in: stop everything already scheduled. Stopping sources rather
  // than recreating the context keeps the audio graph alive, so audio that
  // arrives a millisecond later still has somewhere to play.
  for (const source of scheduled) {
    try { source.stop(); } catch (err) { /* already finished */ }
  }
  scheduled.clear();
  playHead = 0;
}

function makeContext() {
  // Not every browser honours the rate hint; resampling covers the rest.
  try {
    return new AudioContext({ sampleRate: RATE });
  } catch (err) {
    return new AudioContext();
  }
}

function scheduleRetry() {
  // The socket closes at the end of every call, and a server restart drops
  // it too. Reconnecting by hand each time is how a call gets missed, so the
  // page redials on its own and only reports trouble if it cannot.
  if (!wanted || retryTimer) return;
  const delay = Math.min(1000 * 2 ** attempt, 15000);
  attempt += 1;
  setState('reconnecting in ' + Math.round(delay / 1000) + 's…');
  retryTimer = setTimeout(() => {
    retryTimer = null;
    openSocket().catch(() => scheduleRetry());
  }, delay);
}

async function connect() {
  wanted = true;
  joinBtn.disabled = true;
  setState('requesting microphone…');
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true,
             autoGainControl: true, sampleRate: RATE },
  });

  setState('opening audio…');
  micCtx = makeContext();
  playCtx = makeContext();
  await micCtx.resume();
  await openSocket();
}

async function openSocket() {
  setState('connecting…');
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/operator';
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onerror = () => setState('connection failed — is the server running?');

  ws.onopen = () => {
    attempt = 0;
    setState('waiting for a call (' + Math.round(micCtx.sampleRate) + ' Hz mic)');
    if (node) node.disconnect();
    const source = micCtx.createMediaStreamSource(stream);
    node = micCtx.createScriptProcessor(BUFFER, 1, 1);
    node.onaudioprocess = (e) => {
      if (ws.readyState !== WebSocket.OPEN) return;
      const captured = e.inputBuffer.getChannelData(0);
      ws.send(floatToPcm16(resampleTo16k(captured, micCtx.sampleRate)));
    };
    source.connect(node);
    node.connect(micCtx.destination);
  };

  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const event = JSON.parse(e.data);
      if (event.event === 'clear') { flushPlayback(); return; }
      setState('on a call');
      addLine(event);
      return;
    }
    playPcm16(e.data);
  };

  ws.onclose = () => {
    if (node) node.disconnect();
    flushPlayback();
    if (wanted) {
      scheduleRetry();
    } else {
      setState('disconnected');
      joinBtn.disabled = false;
      if (stream) stream.getTracks().forEach((t) => t.stop());
    }
  };
}

joinBtn.addEventListener('click', () => { connect().catch((err) => {
  setState('error: ' + err.message);
  joinBtn.disabled = false;
}); });
</script>
</body>
</html>
