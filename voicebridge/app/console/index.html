<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoiceBridge — operator</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101214; --panel: #171a1d; --line: #24282c;
    --dim: #7d858c; --text: #e8eaec;
    --caller: #7fd1a0; --you: #e0c584; --bad: #e0736a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
         background: var(--bg); color: var(--text); }

  header { display: flex; align-items: center; gap: 20px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  button { font: inherit; padding: 7px 18px; border-radius: 6px; border: 0;
           background: #2f6f4f; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .4; cursor: default; }
  #state { color: var(--dim); }
  .spacer { margin-left: auto; }

  #who { color: var(--dim); font-size: 13px; }
  #who a { color: var(--dim); }
  #dial { display: flex; gap: 8px; }
  #number { font: inherit; width: 170px; padding: 7px 10px; border-radius: 6px;
            border: 1px solid var(--line); background: #0d0f11; color: var(--text); }
  #number::placeholder { color: #545b61; }
  #call { background: #3a5a80; }

  /* Latency is the operator's trust signal: it says whether a silence means
     "still translating" or "something is wrong". */
  #latency { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  #latency div { text-align: right; }
  #latency .k { display: block; font-size: 11px; color: var(--dim);
                text-transform: uppercase; letter-spacing: .6px; }
  #latency .v { font-size: 17px; }
  .over { color: var(--bad); }

  #errors { margin: 0; padding: 0; list-style: none; }
  #errors li { padding: 9px 20px; background: #2b1a19; color: var(--bad);
               border-bottom: 1px solid #3a2422; font-size: 13px; }

  #timeline { flex: 1; overflow-y: auto; margin: 0; padding: 12px 20px 24px;
              list-style: none; }
  .turn { display: grid; grid-template-columns: 74px 1fr 62px; gap: 14px;
          padding: 10px 0; border-bottom: 1px solid var(--line); }
  .who { font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
         padding-top: 3px; }
  .a2b .who { color: var(--caller); }
  .b2a .who { color: var(--you); }
  /* The original is what the operator falls back to when the translation
     reads oddly, so it stays legible rather than being a footnote. */
  .source { margin: 0; color: var(--dim); font-size: 14px; }
  .target { margin: 2px 0 0; font-size: 16px; }
  .lat { text-align: right; color: var(--dim); font-size: 13px; padding-top: 4px;
         font-variant-numeric: tabular-nums; }
  .pending .target { color: var(--dim); font-style: italic; }
  .cut .target::after { content: " — cut off"; color: var(--bad); font-size: 13px; }
  .live { opacity: .65; border-bottom: 0; }
  .live .source { font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>VoiceBridge</h1>
  <button id="join">Connect</button>
  <span id="state">idle</span>
  <form id="dial">
    <input id="number" type="tel" placeholder="+972…" autocomplete="tel" />
    <button id="call" type="submit" disabled>Call</button>
  </form>
  <span class="spacer"></span>
  <span id="who"></span>
  <div id="latency">
    <div><span class="k">last</span><span class="v" id="lat-last">—</span></div>
    <div><span class="k">median</span><span class="v" id="lat-p50">—</span></div>
    <div><span class="k">turns</span><span class="v" id="lat-n">0</span></div>
  </div>
</header>
<ul id="errors"></ul>
<ul id="timeline"></ul>

<script>
const RATE = 16000;          // ADR-002: everything is 16 kHz mono PCM16
// createScriptProcessor only accepts powers of two. 1024 frames at 16 kHz
// is 64 ms of capture latency, which fits the §5 budget.
const BUFFER = 1024;
// SPEC §5: p50 commit -> first audio. Past this the number turns red rather
// than the operator having to remember the budget.
const BUDGET_MS = 1500;
const SIDE = { a2b: 'Caller', b2a: 'You' };

const joinBtn = document.getElementById('join');
const stateEl = document.getElementById('state');
const timelineEl = document.getElementById('timeline');
const errorsEl = document.getElementById('errors');
const latLast = document.getElementById('lat-last');
const latP50 = document.getElementById('lat-p50');
const latN = document.getElementById('lat-n');

let ws, micCtx, playCtx, playHead = 0, node, stream;
let wanted = false, attempt = 0, retryTimer = null;
const scheduled = new Set();

// One entry per utterance, keyed by the correlation ID that §6.5 threads
// through every stage — which is what lets a translation and its latency find
// the row its source text already created.
const turns = new Map();
const liveRows = { a2b: null, b2a: null };
const totals = [];

function setState(text) { stateEl.textContent = text; }

function atBottom() {
  return timelineEl.scrollHeight - timelineEl.scrollTop - timelineEl.clientHeight < 60;
}

function scrollIfFollowing(wasAtBottom) {
  if (wasAtBottom) timelineEl.scrollTop = timelineEl.scrollHeight;
}

function makeRow(direction, extraClass) {
  const li = document.createElement('li');
  li.className = 'turn ' + direction + (extraClass ? ' ' + extraClass : '');
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = SIDE[direction] || direction;
  const texts = document.createElement('div');
  const source = document.createElement('p');
  source.className = 'source';
  // Hebrew must lay out right-to-left next to English in the same column;
  // the browser decides per line from the text itself.
  source.dir = 'auto';
  const target = document.createElement('p');
  target.className = 'target';
  target.dir = 'auto';
  texts.append(source, target);
  const lat = document.createElement('span');
  lat.className = 'lat';
  li.append(who, texts, lat);
  return { li, source, target, lat };
}

function appendRow(row) {
  const following = atBottom();
  timelineEl.append(row.li);
  while (timelineEl.children.length > 400) timelineEl.firstChild.remove();
  scrollIfFollowing(following);
}

// What the ASR is hearing right now, shown as one provisional line per side
// and replaced by a real turn the moment the segmenter commits it.
function showLive(direction, text) {
  let row = liveRows[direction];
  if (!row) {
    row = makeRow(direction, 'live');
    liveRows[direction] = row;
    appendRow(row);
  }
  const following = atBottom();
  row.source.textContent = text;
  scrollIfFollowing(following);
}

function clearLive(direction) {
  const row = liveRows[direction];
  if (!row) return;
  row.li.remove();
  liveRows[direction] = null;
}

function fmt(ms) { return (ms / 1000).toFixed(2) + 's'; }

function median(values) {
  const sorted = [...values].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function recordLatency(ms) {
  totals.push(ms);
  latLast.textContent = fmt(ms);
  latLast.className = 'v' + (ms > BUDGET_MS ? ' over' : '');
  const p50 = median(totals);
  latP50.textContent = fmt(p50);
  latP50.className = 'v' + (p50 > BUDGET_MS ? ' over' : '');
  latN.textContent = String(totals.length);
}

function showError(detail) {
  // Errors go above the transcript, not inside it: a silent direction is the
  // failure an operator cannot diagnose from the transcript alone.
  const li = document.createElement('li');
  li.textContent = detail;
  errorsEl.append(li);
  while (errorsEl.children.length > 4) errorsEl.firstChild.remove();
}

function handleEvent(event) {
  const dir = event.direction;
  const id = event.correlation_id;

  switch (event.name) {
    case 'asr_partial':
    case 'asr_final':
      if (dir && event.text) showLive(dir, event.text);
      return;

    case 'segment_committed': {
      if (!dir || !id) return;
      clearLive(dir);
      const row = makeRow(dir, 'pending');
      row.source.textContent = event.text || '';
      row.target.textContent = 'translating…';
      turns.set(id, { row, committedAt: event.monotonic_ts, mtStart: null, ttsStart: null });
      appendRow(row);
      return;
    }

    case 'mt_started': {
      const turn = turns.get(id);
      if (turn) turn.mtStart = event.monotonic_ts;
      return;
    }

    case 'mt_completed': {
      const turn = turns.get(id);
      if (!turn) return;
      turn.row.li.classList.remove('pending');
      turn.row.target.textContent = event.translated_text || '';
      if (event.source_text) turn.row.source.textContent = event.source_text;
      turn.mtMs = turn.mtStart === null ? null : event.monotonic_ts - turn.mtStart;
      return;
    }

    case 'tts_started': {
      const turn = turns.get(id);
      if (turn) turn.ttsStart = event.monotonic_ts;
      return;
    }

    case 'tts_first_audio': {
      const turn = turns.get(id);
      if (!turn) return;
      const total = event.monotonic_ts - turn.committedAt;
      const ttsMs = turn.ttsStart === null ? null : event.monotonic_ts - turn.ttsStart;
      turn.row.lat.textContent = fmt(total);
      turn.row.lat.className = 'lat' + (total > BUDGET_MS ? ' over' : '');
      const parts = [];
      if (turn.mtMs !== null && turn.mtMs !== undefined) parts.push('translate ' + Math.round(turn.mtMs) + 'ms');
      if (ttsMs !== null) parts.push('speak ' + Math.round(ttsMs) + 'ms');
      if (parts.length) turn.row.lat.title = parts.join(' · ');
      recordLatency(total);
      return;
    }

    case 'tts_cancelled': {
      const turn = turns.get(id);
      if (turn) turn.row.li.classList.add('cut');
      return;
    }

    case 'error':
      showError(event.detail || 'unknown error');
      return;

    default:
      return;
  }
}

function resetCall() {
  turns.clear();
  totals.length = 0;
  liveRows.a2b = liveRows.b2a = null;
  timelineEl.replaceChildren();
  errorsEl.replaceChildren();
  latLast.textContent = latP50.textContent = '—';
  latLast.className = latP50.className = 'v';
  latN.textContent = '0';
}

// Browsers may ignore the requested sampleRate (Safari in particular), so
// capture is resampled here rather than assumed. ADR-002 says the wire is
// always 16 kHz; this is the one place the browser's rate is allowed to differ.
function resampleTo16k(samples, fromRate) {
  if (fromRate === RATE) return samples;
  const ratio = fromRate / RATE;
  const out = new Float32Array(Math.floor(samples.length / ratio));
  for (let i = 0; i < out.length; i++) {
    const pos = i * ratio;
    const low = Math.floor(pos);
    const high = Math.min(low + 1, samples.length - 1);
    out[i] = samples[low] + (samples[high] - samples[low]) * (pos - low);
  }
  return out;
}

function floatToPcm16(samples) {
  const out = new DataView(new ArrayBuffer(samples.length * 2));
  for (let i = 0; i < samples.length; i++) {
    const clamped = Math.max(-1, Math.min(1, samples[i]));
    out.setInt16(i * 2, clamped * 0x7fff, true);
  }
  return out.buffer;
}

function playPcm16(buffer) {
  const view = new DataView(buffer);
  const frames = buffer.byteLength / 2;
  if (!frames) return;
  const audio = playCtx.createBuffer(1, frames, RATE);
  const channel = audio.getChannelData(0);
  for (let i = 0; i < frames; i++) channel[i] = view.getInt16(i * 2, true) / 0x8000;
  const source = playCtx.createBufferSource();
  source.buffer = audio;
  source.connect(playCtx.destination);
  // Keep a small lead so chunks butt up against each other without gaps.
  playHead = Math.max(playHead, playCtx.currentTime + 0.05);
  source.start(playHead);
  playHead += audio.duration;
  scheduled.add(source);
  source.onended = () => scheduled.delete(source);
}

function flushPlayback() {
  // Barge-in: stop everything already scheduled. Stopping sources rather
  // than recreating the context keeps the audio graph alive, so audio that
  // arrives a millisecond later still has somewhere to play.
  for (const source of scheduled) {
    try { source.stop(); } catch (err) { /* already finished */ }
  }
  scheduled.clear();
  playHead = 0;
}

function makeContext() {
  // Not every browser honours the rate hint; resampling covers the rest.
  try {
    return new AudioContext({ sampleRate: RATE });
  } catch (err) {
    return new AudioContext();
  }
}

function scheduleRetry() {
  // The socket closes at the end of every call, and a server restart drops
  // it too. Reconnecting by hand each time is how a call gets missed, so the
  // page redials on its own and only reports trouble if it cannot.
  if (!wanted || retryTimer) return;
  const delay = Math.min(1000 * 2 ** attempt, 15000);
  attempt += 1;
  setState('reconnecting in ' + Math.round(delay / 1000) + 's…');
  retryTimer = setTimeout(() => {
    retryTimer = null;
    openSocket().catch(() => scheduleRetry());
  }, delay);
}

async function connect() {
  wanted = true;
  joinBtn.disabled = true;
  setState('requesting microphone…');
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true,
             autoGainControl: true, sampleRate: RATE },
  });

  setState('opening audio…');
  micCtx = makeContext();
  playCtx = makeContext();
  await micCtx.resume();
  await openSocket();
}

async function openSocket() {
  setState('connecting…');
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/operator';
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';

  ws.onerror = () => setState('connection failed — is the server running?');

  ws.onopen = () => {
    attempt = 0;
    setState('waiting for a call (' + Math.round(micCtx.sampleRate) + ' Hz mic)');
    if (node) node.disconnect();
    const source = micCtx.createMediaStreamSource(stream);
    node = micCtx.createScriptProcessor(BUFFER, 1, 1);
    node.onaudioprocess = (e) => {
      if (ws.readyState !== WebSocket.OPEN) return;
      const captured = e.inputBuffer.getChannelData(0);
      ws.send(floatToPcm16(resampleTo16k(captured, micCtx.sampleRate)));
    };
    source.connect(node);
    node.connect(micCtx.destination);
  };

  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      const event = JSON.parse(e.data);
      if (event.event === 'clear') { flushPlayback(); return; }
      if (stateEl.textContent !== 'on a call') { resetCall(); setState('on a call'); }
      handleEvent(event);
      return;
    }
    playPcm16(e.data);
  };

  ws.onclose = () => {
    if (node) node.disconnect();
    flushPlayback();
    if (wanted) {
      scheduleRetry();
    } else {
      setState('disconnected');
      joinBtn.disabled = false;
      if (stream) stream.getTracks().forEach((t) => t.stop());
    }
  };
}

joinBtn.addEventListener('click', () => { connect().catch((err) => {
  setState('error: ' + err.message);
  joinBtn.disabled = false;
}); });

// Who is signed in (SPEC A8). A console with no login says so rather than
// leaving the corner blank and looking the same as a protected one.
fetch('/auth/me').then((r) => r.json()).then((me) => {
  const who = document.getElementById('who');
  if (me.email) {
    who.innerHTML = '';
    who.append(me.email + ' · ');
    const out = document.createElement('a');
    out.href = '/auth/logout';
    out.textContent = 'sign out';
    who.append(out);
  } else if (!me.required) {
    who.textContent = 'no login configured';
  }
}).catch(() => {});

// Dialling out (SPEC A7). The button stays disabled until the console is in
// the queue: a call placed with nobody listening reaches a person who hears
// silence.
const dialForm = document.getElementById('dial');
const numberEl = document.getElementById('number');
const callBtn = document.getElementById('call');

function refreshDialButton() {
  callBtn.disabled = !(ws && ws.readyState === WebSocket.OPEN) || !numberEl.value.trim();
}

numberEl.addEventListener('input', refreshDialButton);
setInterval(refreshDialButton, 500);

dialForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  callBtn.disabled = true;
  setState('dialling ' + numberEl.value.trim() + '…');
  try {
    const response = await fetch('/call', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ to: numberEl.value.trim() }),
    });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) {
      showError('Call failed: ' + (body.detail || response.status));
      setState('waiting for a call');
    } else {
      setState('ringing…');
    }
  } catch (err) {
    showError('Call failed: ' + err.message);
  } finally {
    refreshDialButton();
  }
});
</script>
</body>
</html>
