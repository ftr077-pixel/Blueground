[project]
name = "voicebridge"
version = "0.1.0"
description = "Real-time bidirectional call translation bridge (SPEC.md)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["torch", "silero_vad"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["server", "operator-client", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
docstring-code-format = true
